	<script>

  const counters = document.querySelectorAll(".counter");



  counters.forEach(counter => {

    const target = +counter.getAttribute("data-target");

    let count = 0;



    const updateCounter = () => {

      if (count < target) {

        count += Math.ceil(target / 100); // speed

        counter.innerText = count;

        requestAnimationFrame(updateCounter);

      } else {

        counter.innerText = target + "+";

      }

    };



    updateCounter();

  });







 







</script>

<script>
  /*
   * Astonic Mart - Mobile Sidebar Controls
   *
   * Handles:
   * 1. Browse Categories
   * 2. Product Filters
   *
   * Mobile only.
   * Desktop remains unchanged.
   */

  document.addEventListener('click', function (event) {

    /* Mobile only */
    if (window.innerWidth > 767) {
      return;
    }


    /* =====================================================
       BROWSE CATEGORIES
       ===================================================== */

    const categoryHead =
      event.target.closest('.sidebar-categories > .head');

    if (categoryHead) {

      const sidebar =
        categoryHead.closest('.sidebar-categories');

      if (sidebar) {
        sidebar.classList.toggle('mobile-open');
      }

      return;
    }


    /* =====================================================
       PRODUCT FILTERS
       ===================================================== */

    const filterHead =
      event.target.closest('.sidebar-filter > .top-filter-head');

    if (filterHead) {

      const filter =
        filterHead.closest('.sidebar-filter');

      if (filter) {
        filter.classList.toggle('mobile-filter-open');
      }

    }

  });
</script>
