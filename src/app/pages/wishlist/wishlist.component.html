<div class="container py-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">
            My Wishlist
        </h2>

        <p class="text-muted">
            Save your favourite products and buy them later.
        </p>

    </div>

    <div
        *ngIf="wishlistItems.length === 0"
        class="text-center py-5">

        <h4>Your wishlist is empty</h4>

        <p class="text-muted">
            Click the heart icon on any product to add it here.
        </p>

    </div>

    <div class="row" *ngIf="wishlistItems.length">

        <div
            class="col-lg-3 col-md-4 col-sm-6 mb-4"
            *ngFor="let item of wishlistItems">

            <div class="card h-100 shadow-sm">

                <img
                    [src]="item.images[0]"
                    class="card-img-top p-3"
                    style="height:220px;object-fit:contain;">

                <div class="card-body d-flex flex-column">

                    <h6 class="fw-bold">

                        {{item.name}}

                    </h6>

                    <p class="text-muted mb-1">

                        {{item.brand}}

                    </p>

                    <h5 class="text-primary">

                        ₦{{item.price | number}}

                    </h5>

                    <div class="mt-auto">

                        <a
                            [routerLink]="['/product', item.id]"
                            class="btn btn-outline-primary btn-sm w-100 mb-2">

                            View Product

                        </a>

                        <button
                            class="btn btn-warning btn-sm w-100 mb-2"
                            (click)="addToCart(item)">

                            Add to Cart

                        </button>

                        <button
                            class="btn btn-danger btn-sm w-100"
                            (click)="remove(item.id)">

                            Remove

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
