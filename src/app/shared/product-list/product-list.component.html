<!-- =========================================================
     ORIGINAL FILTER BAR + PAGINATION
     ========================================================= -->

<!-- Start Filter Bar -->
<div class="filter-bar d-flex flex-wrap align-items-center mb-4">

  <!-- Sorting -->
  <div class="sorting">
    <select
      class="form-select"
      [value]="sortOption"
      (change)="onSortChange($event)"
    >
      <option value="default">Default sorting</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
      <option value="name-asc">Name: A to Z</option>
    </select>
  </div>

  <!-- Items Per Page -->
  <div class="sorting mr-auto">
    <select
      class="form-select"
      [value]="itemsPerPage"
      (change)="onItemsPerPageChange($event)"
    >
      <option value="5">Show 5</option>
      <option value="9">Show 9</option>
      <option value="10">Show 10</option>
      <option value="15">Show 15</option>
      <option value="25">Show 25</option>
    </select>
  </div>

  <!-- Pagination Numbers -->
  <div class="pagination">

    <!-- Previous -->
    <a
      href="#"
      class="prev-arrow"
      [class.disabled]="currentPage === 1"
      (click)="prevPage($event)"
    >
      <i
        class="fa fa-long-arrow-left"
        aria-hidden="true"
      ></i>
    </a>

    <!-- Visible Pages -->
    <ng-container *ngFor="let page of getVisiblePages()">

      <a
        href="#"
        [class.active]="page === currentPage"
        (click)="goToPage(page, $event)"
      >
        {{ page }}
      </a>

    </ng-container>

    <!-- Dots -->
    <a
      href="#"
      class="dot-dot"
      *ngIf="totalPages > 5"
      (click)="$event.preventDefault()"
    >
      <i
        class="fa fa-ellipsis-h"
        aria-hidden="true"
      ></i>
    </a>

    <!-- Last Page -->
    <a
      href="#"
      [class.active]="totalPages === currentPage"
      (click)="goToPage(totalPages, $event)"
      *ngIf="totalPages > 5"
    >
      {{ totalPages }}
    </a>

    <!-- Next -->
    <a
      href="#"
      class="next-arrow"
      [class.disabled]="currentPage === totalPages"
      (click)="nextPage($event)"
    >
      <i
        class="fa fa-long-arrow-right"
        aria-hidden="true"
      ></i>
    </a>

  </div>

</div>
<!-- End Filter Bar -->


<!-- =========================================================
     START PRODUCT GRID
     ========================================================= -->

<section class="lattest-product-area pb-40 category-list">

  <div class="row">

    <!-- Single Product -->
    <div
      class="col-6 col-md-6 col-lg-4 mb-4"
      *ngFor="let prod of paginatedProducts"
    >

      <div class="single-product">

        <!-- Product Image -->
        <a [routerLink]="['/product', prod.id]">

          <img
            class="img-fluid"
            [src]="prod.images[0]"
            [alt]="prod.name"
          />

        </a>


        <!-- Product Details -->
        <div class="product-details">

          <!-- Product Name -->
          <h6>

            <a
              [routerLink]="['/product', prod.id]"
              class="text-decoration-none"
            >
              {{ prod.name }}
            </a>

          </h6>


          <!-- =================================================
               PRICE
               ================================================= -->

          <div class="price">

            <!-- Discount Price -->
            <ng-container
              *ngIf="
                prod.discountPrice &&
                prod.discountPrice < prod.price;
                else regularPrice
              "
            >

              <!-- Current Selling Price -->
              <span class="selling-price">
                ₦{{ prod.discountPrice | number }}
              </span>

              <!-- Original Price -->
              <span class="old-price">
                ₦{{ prod.price | number }}
              </span>

            </ng-container>


            <!-- Regular Price -->
            <ng-template #regularPrice>

              <span class="selling-price">
                ₦{{ prod.price | number }}
              </span>

            </ng-template>

          </div>


          <!-- =================================================
               PRODUCT ACTIONS
               ================================================= -->

          <div class="prd-bottom">

  <!-- Add to Cart -->
  <a
    href="javascript:void(0)"
    class="social-info"
    (click)="addToCart(prod); $event.preventDefault()"
    title="Add to Cart"
  >
    <span class="ti-bag"></span>
    <p class="hover-text">Add to Cart</p>
  </a>

  <!-- Wishlist -->
  <a
    href="javascript:void(0)"
    class="social-info"
    (click)="addToWishlist(prod); $event.preventDefault()"
    title="Wishlist"
  >
    <span class="lnr lnr-heart"></span>
    <p class="hover-text">Wishlist</p>
  </a>

  <!-- Compare -->
  <a
    href="javascript:void(0)"
    class="social-info"
    (click)="addToCompare(prod); $event.preventDefault()"
    title="Compare"
  >
    <span class="lnr lnr-sync"></span>
    <p class="hover-text">Compare</p>
  </a>

  <!-- View Product -->
  <a
    [routerLink]="['/product', prod.id]"
    class="social-info"
    title="View Product"
  >
    <span class="lnr lnr-eye"></span>
    <p class="hover-text">View Product</p>
  </a>

</div>

        </div>
        <!-- End Product Details -->

      </div>
      <!-- End Single Product -->

    </div>
    <!-- End Product -->

  </div>

</section>
<!-- End Product Grid -->
